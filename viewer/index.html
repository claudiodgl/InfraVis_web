<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfraVis — The National Research Infrastructure for Data Visualization</title>
    <meta name="description" content="InfraVis helps researchers in every field see their data: a national research infrastructure of nine Swedish universities, funded by the Swedish Research Council." />
    <link rel="icon" type="image/svg+xml" href="./lib/logos/infravis-mark.svg" />
    <script>
      // theme before first paint: the saved choice, else the system's
      (function () {
        var t = null; try { t = localStorage.getItem('iv-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
